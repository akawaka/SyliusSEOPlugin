imports:
    - { resource: "@AkawakaSyliusSEOPlugin/config/config.yaml" }
    # Only present when the CMS plugin is installed (integration tests).
    - { resource: "@AkawakaSyliusCMSPlugin/config/config.yaml", ignore_errors: true }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Akawaka\SyliusSEOPlugin
